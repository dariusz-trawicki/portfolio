# The agent's state (step 5c): LangGraph checkpoints (PostgresSaver) + the incident list.
# A PersistentVolumeClaim, so the data survives pod restarts and rescheduling
# (kind's default StorageClass "standard" keeps it in a directory on the node).
#
# The password lives in the Secret "postgres", created once by `make agent-secrets`
# (never in git). Deleting the PVC deletes all incidents: `make agent-down` keeps it.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: incident-agent
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: incident-agent}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: incident-agent
  labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: incident-agent}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: incident-agent}
    spec:
      securityContext:                 # uid 70 = the "postgres" user in the alpine image
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_USER, value: agent}
            - {name: POSTGRES_DB, value: agent}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: password}}
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: [pg_isready, -U, agent, -d, agent]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: [pg_isready, -U, agent, -d, agent]}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: run, mountPath: /var/run/postgresql}
      volumes:
        - name: run
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests: {storage: 1Gi}
