# The agent in the cluster (step 5d): webhook + approval page + /metrics on port 8787.
#
#   Alertmanager (otel-demo) --POST--> Service incident-agent:8787 --> this pod --> Postgres
#   Prometheus scrapes /metrics thanks to the prometheus.io/* annotations (kubernetes-pods job).
#   You reach the approval page with `make agent-pf` -> http://localhost:8787/
#
# Secrets (never in git), created by `make agent-secrets`:
#   incident-agent-env   ANTHROPIC_API_KEY, WEBHOOK_TOKEN, AGENT_MODEL, AGENT_LANGUAGE
#   postgres             password
#   incident-agent-gitops  (optional, `make agent-gitops`) GITOPS_TOKEN for the rollback PRs
apiVersion: v1
kind: ConfigMap
metadata:
  name: incident-agent-config
  namespace: incident-agent
data:
  # In-cluster addresses instead of the localhost port-forwards used by `make serve`.
  TARGET_NAMESPACE: otel-demo
  HELM_RELEASE: otel-demo
  PROMETHEUS_URL: http://prometheus.otel-demo.svc:9090
  OPENSEARCH_URL: http://opensearch.otel-demo.svc:9200
  FLAGD_OFREP_URL: http://flagd.otel-demo.svc:8016
  FLAGD_UI_URL: http://frontend-proxy.otel-demo.svc:8080/feature
  DEDUP_WINDOW_MINUTES: "30"
  AGENT_MAX_TOOL_CALLS: "12"
---
apiVersion: v1
kind: Service
metadata:
  name: incident-agent
  namespace: incident-agent
  labels: {app.kubernetes.io/name: incident-agent}
spec:
  selector: {app.kubernetes.io/name: incident-agent}
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: incident-agent
  namespace: incident-agent
  labels: {app.kubernetes.io/name: incident-agent}
spec:
  # Exactly one: a single worker owns the queue. Two replicas would each get every alert
  # and investigate (and pay for) every incident twice.
  replicas: 1
  # Recreate, not RollingUpdate: never two agents at once, not even for a few seconds of an update.
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: incident-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: incident-agent}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8787"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: incident-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Start only once the database accepts connections (no CrashLoopBackOff on a fresh install).
        - name: wait-for-postgres
          image: postgres:17-alpine
          command: [sh, -c, "until pg_isready -h postgres -U agent -d agent; do sleep 2; done"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            limits: {memory: 32Mi}
      containers:
        - name: agent
          image: incident-agent:dev
          imagePullPolicy: IfNotPresent      # the image comes from `kind load`, not a registry
          args: [serve, --host, 0.0.0.0, --port, "8787", --fixes, live, --out-dir, /tmp/reports]
          envFrom:
            - secretRef: {name: incident-agent-env}
            - configMapRef: {name: incident-agent-config}
            # Step 5e, created by `make agent-gitops` (rollbacks as PRs); absent = `kubectl rollout undo`.
            - configMapRef: {name: incident-agent-gitops, optional: true}
            - secretRef: {name: incident-agent-gitops, optional: true}
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres, key: password}}
            - name: CHECKPOINT_DB              # $(VAR) is expanded by Kubernetes from the variable above
              value: postgresql://agent:$(POSTGRES_PASSWORD)@postgres:5432/agent
          ports:
            - {name: http, containerPort: 8787}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}     # reports + kubectl cache; everything durable is in Postgres
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 100Mi}
