[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kestrel-voice-agent"
version = "0.1.0"
description = "Real-time voice customer-support agent for a fictional UK electricity supplier"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Voice
    "livekit-agents>=1.8",
    "livekit-plugins-langchain>=1.8",

    # Agent & LLM
    "langchain>=1.0",
    "langchain-groq>=1.0",

    # Knowledge base
    "docling",
    "qdrant-client>=1.10",
    "sentence-transformers>=3.0",

    # Utilities
    "pydantic-settings",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "reportlab"]

[tool.hatch.build.targets.wheel]
packages = ["energy_agent", "voice_agent"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long prose strings in prompts and documents
