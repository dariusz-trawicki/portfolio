[project]
name = "local-english-teacher"
version = "0.2.0"
description = "Local voice English teacher: Whisper STT -> Ollama LLM -> TTS over WebRTC, with metrics."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastrtc>=0.0.19",
    "faster-whisper>=1.1.0",
    "ollama>=0.4.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Cross-platform neural TTS (used in Docker / Linux; optional on macOS).
piper = ["piper-tts>=1.3.0"]

[project.scripts]
english-teacher = "english_teacher.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/english_teacher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
