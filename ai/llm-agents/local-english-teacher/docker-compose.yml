# Default:            monitoring only (Prometheus + Grafana) -> app runs natively (macOS)
# --profile app:      also run the teacher in a container (Linux)
# --profile ollama:   also run Ollama in a container (Linux; on macOS use native Ollama for Metal GPU)

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/teacher.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  teacher:
    profiles: ["app"]
    build: .
    image: local-english-teacher:latest
    environment:
      TEACHER_LLM__HOST: ${OLLAMA_URL:-http://host.docker.internal:11434}
      TEACHER_LLM__MODEL: ${TEACHER_MODEL:-llama3.1:8b}
      TEACHER_STT__MODEL_SIZE: ${TEACHER_WHISPER:-small}
    volumes:
      - teacher-data:/app/data
      - hf-cache:/home/teacher/.cache/huggingface
    ports:
      - "7860:7860"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  teacher-data:
  hf-cache:
  ollama-data:
