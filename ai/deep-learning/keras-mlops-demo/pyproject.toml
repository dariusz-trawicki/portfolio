[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keras-mlops-demo"
version = "0.1.0"
description = "End-to-end MLOps on Keras 3: data validation, MLflow tracking, quality gate, model registry, FastAPI serving, drift monitoring"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "keras>=3.5",
    "jax",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "mlflow",
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]
figures = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`",
]
