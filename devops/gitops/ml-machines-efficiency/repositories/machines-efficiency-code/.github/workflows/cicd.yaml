name: Build and update manifests

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  PROJECT_ID: <your_project_id>
  REGISTRY: europe-central2-docker.pkg.dev
  IMAGE: europe-central2-docker.pkg.dev/<your_project_id>/mlops-apps/machines-efficiency
  CONFIG_REPO: <repo_user>/machines-efficiency-k8s-manifests

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lint and test
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run pytest -q

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker $REGISTRY --quiet
      
      - name: Build
        run: docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true

      - name: Push
        run: docker push "$IMAGE:$GITHUB_SHA"

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONFIG_REPO }}
          token: ${{ secrets.CONFIG_REPO_PAT }}
          path: config

      - name: Bump image tag
        env:
          NEW_IMAGE: ${{ env.IMAGE }}:${{ github.sha }}
        run: |
          cd config
          yq -i '(.spec.template.spec.containers[] | select(.name == "app") | .image) = strenv(NEW_IMAGE)' k8s/deployment.yaml

          grep -q "$NEW_IMAGE" k8s/deployment.yaml || {
            echo "yq didn't replace the tag - check the container name in the manifest"
            exit 1
          }

          if git diff --quiet; then
            echo "No change - the manifest already points to this image"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: machines-efficiency ${GITHUB_SHA::7}"
          git push
