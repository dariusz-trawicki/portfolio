apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: iris-api-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dariusz-trawicki/iris-mlops-config.git
    targetRevision: main
    path: overlays/local
  destination:
    server: https://kubernetes.default.svc
    namespace: iris-test
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
