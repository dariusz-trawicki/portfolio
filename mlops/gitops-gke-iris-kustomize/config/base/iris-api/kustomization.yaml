apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - hpa.yaml
  - pdb.yaml

configMapGenerator:
  - name: iris-api-dashboard
    files:
      - dashboards/iris-api.json
    options:
      labels:
        grafana_dashboard: "1"
