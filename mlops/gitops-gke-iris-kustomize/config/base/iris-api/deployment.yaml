apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      serviceAccountName: iris-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: iris-api-placeholder
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: iris-api-config
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          startupProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            periodSeconds: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 6
            timeoutSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 512Mi }
