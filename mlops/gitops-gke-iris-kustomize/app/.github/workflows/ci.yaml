name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only by default. The build job raises id-token for itself locally.
permissions:
  contents: read

# Two builds on main would race against each other when pushing to the config repo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PROJECT_ID: <YOUR_PROJECT_ID>
  REGION: europe-central2
  AR_REPO: iris
  IMAGE_NAME: api
  CONFIG_REPO: <YOUR_CONFIG_REPO>
  # Image name as it appears in base/iris-api/deployment.yaml.
  # Check: grep -n 'image:' base/iris-api/deployment.yaml
  IMAGE_KEY: iris-api-placeholder

jobs:
  quality:
    name: lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install
        run: uv sync --locked --all-extras --dev

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format)
        run: uv run ruff format --check .

      - name: Pytest
        run: uv run pytest -q

  build:
    name: build + push
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # without this there's no OIDC token for WIF
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compose image path
        id: meta
        run: |
          echo "image=${REGION}-docker.pkg.dev/${PROJECT_ID}/${AR_REPO}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Auth to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: iris-gh-ci@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          provenance: false      # otherwise AR gets a manifest list and the digest points at the index
          tags: |
            ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  scan:
    name: trivy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Auth to GCP (WIF)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: iris-gh-ci@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true   # an unpatched CVE in the base layer would block every build
          exit-code: '1'

  bump:
    name: bump image in config repo
    needs: [build, scan]
    runs-on: ubuntu-latest
    steps:
      - name: Mint installation token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.CI_APP_ID }}
          private-key: ${{ secrets.CI_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.CONFIG_REPO }}

      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/${{ env.CONFIG_REPO }}
          token: ${{ steps.app-token.outputs.token }}
          path: config

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Set image digest
        working-directory: config/overlays/dev
        run: |
          kustomize edit set image \
            "${IMAGE_KEY}=${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

          if ! grep -q "digest: sha256:" kustomization.yaml; then
            echo "kustomize edit did not replace the image — check IMAGE_KEY (${IMAGE_KEY}) against 'image:' in base/iris-api/deployment.yaml" >&2
            exit 1
          fi

      - name: Commit & push
        working-directory: config
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          git config user.name  "${APP_SLUG}[bot]"
          git config user.email "${APP_SLUG}[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes — same digest, nothing to do."
            exit 0
          fi

          git add overlays/dev/kustomization.yaml
          git commit -m "chore(dev): iris-api @ ${GITHUB_SHA::7}

          Source: ${{ github.repository }}@${{ github.sha }}
          Image:  ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}"

          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push rejected (attempt ${attempt}) — rebase and retry."
            git pull --rebase
            sleep $((attempt * 3))
          done
          echo "Failed to push after 3 attempts." >&2
          exit 1
